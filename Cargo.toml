[workspace]
resolver = "2"
members = [
    "crates/promptos-core",
    "crates/promptos-llama",
    "crates/promptos-profiles",
    "crates/promptos-history",
    "crates/promptos-plugin",
    "crates/promptos-provider",
    "crates/promptos-eval",
    "crates/promptos-keychain",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rmp-serde = "1"
zstd = "0.13"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
wasmtime = "21"
security-framework = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
similar = "2"
regex = "1"
sha2 = "0.10"
